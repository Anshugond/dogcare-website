<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Landing Page Studio</title>
<style>
:root{--ink:#17212b;--muted:#64748b;--line:#e2e8f0;--blue:#2563eb;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;font:14px Inter,system-ui,Arial;color:var(--ink);background:var(--bg)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;font-weight:650;background:#e8eefc;color:#1d4ed8}.primary{background:var(--blue);color:white}.danger{background:#fee2e2;color:#b91c1c}.shell{max-width:1440px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{font-size:20px;font-weight:800}.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:18px}.login{max-width:390px;margin:12vh auto}.hidden{display:none!important}.grid{display:grid;grid-template-columns:310px 1fr;gap:16px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:700;color:#475569}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}.field textarea{min-height:75px;resize:vertical}.pageitem{padding:12px;border:1px solid var(--line);border-radius:9px;margin-top:9px;cursor:pointer}.pageitem.active{border-color:var(--blue);background:#eff6ff}.muted{color:var(--muted)}.editor{display:grid;grid-template-columns:minmax(260px,340px) minmax(400px,1fr);gap:14px}.preview{background:#e8edf4;border-radius:12px;padding:14px;min-height:640px}.preview iframe{width:100%;height:680px;border:0;border-radius:8px;background:#fff}.section{border:1px solid var(--line);padding:12px;border-radius:9px;margin:9px 0;background:#fff}.section h4{margin:0 0 7px}.toast{padding:10px;border-radius:8px;background:#ecfdf5;color:#047857;margin:10px 0}.login input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px}@media(max-width:850px){.grid,.editor{grid-template-columns:1fr}.preview iframe{height:600px}}
</style></head><body><div id="login" class="panel login"><h2>Landing Page Studio</h2><p class="muted">Admin login</p><div class="field"><label>Admin password</label><input id="password" type="password" autocomplete="current-password"></div><button class="primary" id="loginBtn">Login</button><p id="loginErr" class="muted"></p></div>
<div id="app" class="shell hidden"><div class="top"><div><div class="brand">Landing Page Studio</div><div class="muted">Create • Design • Publish</div></div><div class="row"><button id="newBtn" class="primary">+ New landing page</button><button id="logoutBtn">Logout</button></div></div>
<div class="grid"><aside class="panel"><h3>Your pages</h3><div id="pages"></div></aside><main class="panel"><div id="empty"><h2>Build your next landing page</h2><p class="muted">Create a new page or choose an existing one.</p></div><div id="workspace" class="hidden">
<div class="row"><div style="flex:1"><h2 id="heading">New page</h2><span id="status" class="muted">Draft</span></div><button id="previewBtn">Refresh preview</button><button id="saveBtn">Save draft</button><button id="publishBtn" class="primary">Publish</button></div>
<div class="editor"><div>
<div class="field"><label>Page / product name</label><input id="title"></div><div class="field"><label>URL slug</label><input id="slug" placeholder="my-new-ebook"></div>
<div class="field"><label>Main product name</label><input id="productName"></div><div class="field"><label>Price (INR)</label><input id="price" type="number" min="1"></div>
<div class="field"><label>Main PDF</label><input id="mainFile" type="file" accept="application/pdf"><button type="button" id="uploadMain">Upload main PDF to secure storage</button><input id="mainKey" placeholder="Uploaded R2 object key" readonly></div>
<hr><h3>Order bump</h3><label><input id="bumpEnabled" type="checkbox"> Enable optional add-on</label>
<div class="field"><label>Add-on title</label><input id="bumpTitle"></div><div class="field"><label>Add-on price (INR)</label><input id="bumpPrice" type="number" min="0"></div><div class="field"><label>Add-on PDF</label><input id="bumpFile" type="file" accept="application/pdf"><button type="button" id="uploadBump">Upload add-on PDF</button><input id="bumpKey" placeholder="Uploaded R2 object key"></div>
<hr><h3>Design</h3><div class="field"><label>Hero headline</label><textarea id="heroTitle"></textarea></div><div class="field"><label>Subheadline</label><textarea id="subtitle"></textarea></div><div class="field"><label>Accent color</label><input id="accent" type="color" value="#2563eb"></div>
<div class="field"><label>Hero image URL or upload</label><input id="heroImage" placeholder="https://..."><input id="heroFile" type="file" accept="image/png,image/jpeg,image/webp"><button type="button" id="uploadHero">Upload hero image</button></div><div class="field"><label>Meta Pixel ID (optional)</label><input id="pixelId"></div>
<div class="row"><button id="addFeature">+ Add feature section</button><button id="addFaq">+ Add FAQ section</button></div><div id="sections"></div>
</div><div class="preview"><div class="muted" style="margin:0 0 8px">Live preview (mobile-friendly)</div><iframe id="frame" title="Landing page preview"></iframe></div></div></div></main></div></div>
<script>
const $=id=>document.getElementById(id);let pages=[],current=null,sections=[];
async function api(path,opts={}){const r=await fetch('/api/admin/'+path,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Request failed');return d}
function showApp(){ $('login').classList.add('hidden');$('app').classList.remove('hidden');loadPages() }
async function loadPages(){try{pages=(await api('pages')).pages;renderPages()}catch(e){if(e.message.includes('login')){ $('app').classList.add('hidden');$('login').classList.remove('hidden')}else alert(e.message)}}
function renderPages(){ $('pages').innerHTML=pages.map(p=>`<div class="pageitem ${current&&current.id===p.id?'active':''}" data-id="${p.id}"><b>${esc(p.title)}</b><div class="muted">/${esc(p.slug)} · ${p.status}</div></div>`).join('')||'<p class="muted">No pages yet.</p>';document.querySelectorAll('.pageitem').forEach(x=>x.onclick=()=>openPage(x.dataset.id))}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function defaults(title='New Ebook'){return {title,slug:'',productName:title,price:149,mainObjectKey:'main-ebook.pdf',bumpEnabled:false,bumpTitle:'Bonus Ebook',bumpPrice:49,bumpObjectKey:'recipe-ebook.pdf',heroTitle:title,subtitle:'Discover everything you need in one practical guide.',accent:'#2563eb',heroImage:'',pixelId:'',sections:[{type:'features',title:'What you will learn',items:['Step-by-step guidance','Practical tips','Easy to follow']},{type:'faq',title:'Frequently asked questions',items:['How will I receive the ebook?','Is payment secure?']}]}}
function readForm(){return {title:$('title').value,slug:$('slug').value,config:{productName:$('productName').value,price:Number($('price').value),mainObjectKey:$('mainKey').value,bumpEnabled:$('bumpEnabled').checked,bumpTitle:$('bumpTitle').value,bumpPrice:Number($('bumpPrice').value),bumpObjectKey:$('bumpKey').value,heroTitle:$('heroTitle').value,subtitle:$('subtitle').value,accent:$('accent').value,heroImage:$('heroImage').value,pixelId:$('pixelId').value,sections}}}
function writeForm(p){current=p;$('empty').classList.add('hidden');$('workspace').classList.remove('hidden');let c=p.config;$('heading').textContent=p.title;$('title').value=p.title;$('slug').value=p.slug;$('productName').value=c.productName||p.title;$('price').value=c.price??149;$('mainKey').value=c.mainObjectKey||'main-ebook.pdf';$('bumpEnabled').checked=!!c.bumpEnabled;$('bumpTitle').value=c.bumpTitle||'';$('bumpPrice').value=c.bumpPrice??49;$('bumpKey').value=c.bumpObjectKey||'';$('heroTitle').value=c.heroTitle||'';$('subtitle').value=c.subtitle||'';$('accent').value=c.accent||'#2563eb';$('heroImage').value=c.heroImage||'';$('pixelId').value=c.pixelId||'';sections=c.sections||[];$('status').textContent=p.status.toUpperCase();renderSections();preview();renderPages()}
async function openPage(id){try{let d=await api('pages/'+id);writeForm(d.page)}catch(e){alert(e.message)}}
function renderSections(){$('sections').innerHTML=sections.map((s,i)=>`<div class="section"><div class="row"><h4 style="flex:1">${s.type==='faq'?'FAQ':'Features'} section</h4><button data-up="${i}">↑</button><button data-down="${i}">↓</button><button class="danger" data-del="${i}">Remove</button></div><div class="field"><label>Section heading</label><input data-title="${i}" value="${esc(s.title)}"></div><div class="field"><label>Items (one per line)</label><textarea data-items="${i}">${esc((s.items||[]).join('\n'))}</textarea></div></div>`).join('');document.querySelectorAll('[data-title]').forEach(x=>x.oninput=()=>{sections[+x.dataset.title].title=x.value;preview()});document.querySelectorAll('[data-items]').forEach(x=>x.oninput=()=>{sections[+x.dataset.items].items=x.value.split('\n').filter(Boolean);preview()});document.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{sections.splice(+x.dataset.del,1);renderSections();preview()});document.querySelectorAll('[data-up]').forEach(x=>x.onclick=()=>move(+x.dataset.up,-1));document.querySelectorAll('[data-down]').forEach(x=>x.onclick=()=>move(+x.dataset.down,1))}
function move(i,d){let j=i+d;if(j<0||j>=sections.length)return;[sections[i],sections[j]]=[sections[j],sections[i]];renderSections();preview()}
function preview(){let f=readForm(),c=f.config;let sect=c.sections.map(s=>`<section><h2>${esc(s.title)}</h2>${s.type==='faq'?s.items.map(x=>`<p>＋ ${esc(x)}</p>`).join(''): '<ul>'+s.items.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>'}</section>`).join('');$('frame').srcdoc=`<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font:16px Arial;color:#17212b}header{background:${c.accent};color:white;padding:42px 22px;text-align:center}h1{font-size:32px}main{max-width:760px;margin:auto;padding:20px}section{padding:22px 0;border-bottom:1px solid #ddd}img{max-width:100%;border-radius:12px}button{background:${c.accent};color:white;border:0;border-radius:30px;padding:14px 28px;font-weight:bold} .price{font-size:28px;font-weight:bold}</style><header>${c.heroImage?`<img src="${esc(c.heroImage)}">`:''}<h1>${esc(c.heroTitle)}</h1><p>${esc(c.subtitle)}</p><div class="price">₹${c.price}</div><button>Buy now</button></header><main>${sect}<h2>Get instant access</h2><p>Secure checkout · Instant digital delivery</p><button>Buy now · ₹${c.price}</button></main></html>`}
async function save(status='draft'){if(!current)return;let f=readForm();try{let d=await api('pages/'+current.id,{method:'PUT',body:JSON.stringify({...f,status})});current={...current,title:f.title,slug:d.slug,status,config:f.config};$('status').textContent=status.toUpperCase();await loadPages();alert(status==='published'?'Page published: /'+d.slug:'Draft saved.')}catch(e){alert(e.message)}}
$('loginBtn').onclick=async()=>{try{await api('login',{method:'POST',body:JSON.stringify({password:$('password').value})});showApp()}catch(e){$('loginErr').textContent=e.message}};
$('password').onkeydown=e=>{if(e.key==='Enter')$('loginBtn').click()};
$('newBtn').onclick=async()=>{let t=prompt('Product / landing page name?');if(!t)return;let c=defaults(t);try{let d=await api('pages',{method:'POST',body:JSON.stringify({title:t,slug:t,config:c})});await loadPages();await openPage(d.id)}catch(e){alert(e.message)}};
$('saveBtn').onclick=()=>save('draft');$('publishBtn').onclick=()=>save('published');$('previewBtn').onclick=preview;
$('logoutBtn').onclick=async()=>{await api('logout',{method:'POST'});location.reload()};
$('addFeature').onclick=()=>{sections.push({type:'features',title:'New section',items:['Add a benefit']});renderSections();preview()};
$('addFaq').onclick=()=>{sections.push({type:'faq',title:'FAQ',items:['Add a question']});renderSections();preview()};
async function uploadFile(inputId,kind,targetId){const file=$(inputId).files[0];if(!file)return alert('Pehle file choose karein.');const fd=new FormData();fd.append('file',file);fd.append('kind',kind);try{const r=await fetch('/api/admin/upload',{method:'POST',body:fd});const d=await r.json();if(!r.ok)throw Error(d.error||'Upload failed');$(targetId).value=kind==='image'?location.origin+'/api/media?key='+encodeURIComponent(d.key):d.key;preview();alert('Upload complete.')}catch(e){alert(e.message)}}
$('uploadMain').onclick=()=>uploadFile('mainFile','pdf','mainKey');$('uploadBump').onclick=()=>uploadFile('bumpFile','pdf','bumpKey');$('uploadHero').onclick=()=>uploadFile('heroFile','image','heroImage');
document.querySelectorAll('#workspace input,#workspace textarea').forEach(x=>x.addEventListener('input',()=>{if(x.id!=='sections')preview()}));
(async()=>{try{await api('pages');showApp()}catch{}})();
</script></body></html>
